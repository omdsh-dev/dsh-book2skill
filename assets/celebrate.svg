<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Celebration</title>
  <desc id="d">A book transforms into a sparkling skill card.</desc>

  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#4F6EF7" flood-opacity="0.5"/>
    </filter>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <path id="spark-sm" d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </defs>

  <!-- transformation trail -->
  <path d="M195 222 C 280 190 340 180 388 195" stroke="#4F6EF7" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round"/>

  <!-- book -->
  <g stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 240 C110 233 88 233 76 240 L76 320 C88 313 110 313 130 320 Z"/>
    <path d="M130 240 C150 233 172 233 184 240 L184 320 C172 313 150 313 130 320 Z"/>
    <path d="M130 240 L130 320"/>
  </g>
  <g stroke="#9CA3AF" stroke-width="2" stroke-linecap="round">
    <path d="M88 262 L118 262"/>
    <path d="M88 276 L114 276"/>
    <path d="M88 290 L118 290"/>
    <path d="M142 262 L172 262"/>
    <path d="M142 276 L168 276"/>
    <path d="M142 290 L172 290"/>
  </g>

  <!-- sparkles rising from the book -->
  <g fill="#4F6EF7">
    <use href="#spark-sm" transform="translate(100 218)"/>
    <use href="#spark-sm" transform="translate(150 205) scale(1.1)"/>
    <use href="#spark-sm" transform="translate(120 190) scale(0.8)"/>
  </g>

  <!-- glowing skill card -->
  <rect x="390" y="120" width="210" height="150" rx="20" fill="#4F6EF7" fill-opacity="0.09" stroke="#4F6EF7" stroke-width="2" filter="url(#glow)"/>

  <!-- card content -->
  <g fill="#4F6EF7">
    <use href="#spark" transform="translate(424 158) scale(1.3)"/>
  </g>
  <g stroke="#6B7280" stroke-width="2" stroke-linecap="round">
    <path d="M456 158 L520 158"/>
    <path d="M424 190 L560 190"/>
    <path d="M424 214 L540 214"/>
    <path d="M424 238 L500 238"/>
  </g>

  <!-- celebration sparkles -->
  <g fill="#4F6EF7">
    <use href="#spark" transform="translate(250 100) scale(1)"/>
    <use href="#spark" transform="translate(340 60) scale(0.7)"/>
    <use href="#spark" transform="translate(560 80) scale(1.2)"/>
    <use href="#spark" transform="translate(470 60) scale(0.6)"/>
    <use href="#spark" transform="translate(620 180) scale(0.8)"/>
    <use href="#spark" transform="translate(300 320) scale(0.7)"/>
    <use href="#spark" transform="translate(210 320) scale(0.6)"/>
    <circle cx="180" cy="120" r="2.5"/>
    <circle cx="600" cy="120" r="2"/>
    <circle cx="360" cy="300" r="2.5"/>
    <circle cx="540" cy="300" r="2"/>
  </g>
</svg>
