<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Book to skill pipeline banner</title>
  <desc id="d">A book turns into chapter lines, then into a glowing skill card.</desc>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#4F6EF7" flood-opacity="0.5"/>
    </filter>
    <path id="spark" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z"/>
  </defs>

  <!-- book -->
  <g stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 84 C66 79 50 79 40 84 L40 116 C50 111 66 111 80 116 Z"/>
    <path d="M80 84 C94 79 110 79 120 84 L120 116 C110 111 94 111 80 116 Z"/>
    <path d="M80 84 L80 116"/>
  </g>

  <!-- chapter lines -->
  <g stroke="#6B7280" stroke-width="2" stroke-linecap="round">
    <path d="M150 84 L250 84"/>
    <path d="M150 100 L232 100"/>
    <path d="M150 116 L244 116"/>
  </g>
  <g fill="#4F6EF7">
    <circle cx="150" cy="84" r="2.6"/>
    <circle cx="150" cy="100" r="2.6"/>
    <circle cx="150" cy="116" r="2.6"/>
  </g>

  <!-- arrow -->
  <g stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 100 L322 100"/>
    <path d="M312 90 L324 100 L312 110"/>
  </g>

  <!-- glowing skill card -->
  <rect x="360" y="55" width="240" height="90" rx="18" fill="#4F6EF7" fill-opacity="0.08" stroke="#4F6EF7" stroke-width="2" filter="url(#glow)"/>

  <!-- card content -->
  <g fill="#4F6EF7">
    <use href="#spark" transform="translate(388 82) scale(1.1)"/>
  </g>
  <g stroke="#6B7280" stroke-width="2" stroke-linecap="round">
    <path d="M414 82 L470 82"/>
    <path d="M414 100 L540 100"/>
    <path d="M414 118 L500 118"/>
  </g>

  <!-- accent sparkles -->
  <g fill="#4F6EF7">
    <use href="#spark" transform="translate(292 72) scale(0.7)"/>
    <use href="#spark" transform="translate(560 44) scale(0.6)"/>
  </g>
</svg>
